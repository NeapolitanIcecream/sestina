[project]
name = "sestina"
version = "0.1.0"
description = "Sestina pointwise-first, pairwise-light top-K paper discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sestina = "sestina.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sestina*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
